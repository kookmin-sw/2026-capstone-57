name: Branch Name Check

on:
  create:
  pull_request:

jobs:
  check-name:
    runs-on: ubuntu-latest
    steps:
      - name: Check Branch Name Pattern
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH_NAME="${{ github.head_ref }}"
          else
            BRANCH_NAME="${{ github.ref_name }}"
          fi

          echo "검사 대상 브랜치명: $BRANCH_NAME"

          if [[ ! "$BRANCH_NAME" =~ IG-[0-9]+ ]]; then
            echo "::error::브랜치 이름 형식이 올바르지 않습니다. 'IG-[숫자]' 패턴을 포함해야 합니다. (예: feature/IG-123-login)"
            exit 1
          fi

          echo "올바른 브랜치명입니다: $BRANCH_NAME"
