name: Branch Name Check

on:
  create:
  pull_request:

jobs:
  check-name:
    runs-on: ubuntu-latest
    steps:
      - name: Check Branch Name Pattern
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CREATE_REF: ${{ github.event.ref }}
          CREATE_REF_TYPE: ${{ github.event.ref_type }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BRANCH_NAME="$PR_BRANCH"
          else
            BRANCH_NAME="$CREATE_REF"
          fi

          echo "BRANCH_NAME=[$BRANCH_NAME]"

          if [[ "$EVENT_NAME" == "create" && "$CREATE_REF_TYPE" != "branch" ]]; then
            echo "브랜치 생성이 아니므로 스킵"
            exit 0
          fi

          if [[ ! "$BRANCH_NAME" =~ IG-[0-9]+ ]]; then
            echo "::error::브랜치 이름 형식이 올바르지 않습니다. 예: feature/IG-02-login, $BRANCH_NAME"
            exit 1
          fi

          echo "올바른 브랜치명입니다: $BRANCH_NAME"
