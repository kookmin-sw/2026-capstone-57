name: Branch Name Check

on:
  create:
  pull_request:

jobs:
  check-name:
    runs-on: ubuntu-latest
    steps:
      - name: Check Branch Name Pattern
        shell: bash
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          REF_TYPE: ${{ github.event.ref_type }}
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "ref_type=$REF_TYPE"
          echo "BRANCH_NAME=[$BRANCH_NAME]"

          # create 이벤트에서 tag 생성은 검사 제외
          if [[ "${{ github.event_name }}" == "create" && "$REF_TYPE" != "branch" ]]; then
            echo "브랜치 생성이 아니므로 스킵합니다."
            exit 0
          fi

          if [[ ! "$BRANCH_NAME" =~ IG-[0-9]+ ]]; then
            echo "::error::브랜치 이름 형식이 올바르지 않습니다. IG-[숫자] 패턴 필요. 예: feature/IG-02-login"
            exit 1
          fi

          echo "올바른 브랜치명입니다: $BRANCH_NAME"
