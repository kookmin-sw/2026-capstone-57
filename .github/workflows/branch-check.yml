name: Branch Name Check

on:
  create:
  pull_request:

jobs:
  check-name:
    runs-on: ubuntu-latest
    steps:
      - name: Check Branch Name Pattern
        shell: bash
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          REF_TYPE: ${{ github.event.ref_type }}
        run: |
          # 생성된 브랜치 이름 가져오기
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          
          # 'feature/IG-00...' 형태인지 검사하는 정규식
          # 예시: IG-123 형태가 포함되어 있는지 확인
          if [[ ! "$BRANCH_NAME" =~ IG-[0-9]+ ]]; then
            echo "::error::브랜치 이름 형식이 올바르지 않습니다. IG-[숫자] 패턴 필요. 예: feature/IG-02-login"
            exit 1
          fi

          echo "올바른 브랜치명입니다: $BRANCH_NAME"
