<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body style="margin:0; padding:0; background-color:#f5f5f5; font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="padding:40px 0;">
        <tr>
            <td align="center">
                <table width="420" cellpadding="0" cellspacing="0" style="background:#fff; border-radius:12px; padding:40px; box-shadow:0 2px 8px rgba(0,0,0,0.08);">
                    <tr>
                        <td align="center" style="padding-bottom:24px;">
                            <h1 style="margin:0; font-size:24px; color:#333;">🌤️ 일기예보</h1>
                            <p style="margin:8px 0 0; font-size:14px; color:#888;">일기로 예견하는 보석같은 만남</p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding-bottom:24px;">
                            <p style="margin:0; font-size:15px; color:#555; line-height:1.6;">
                                안녕하세요! 대학 이메일 인증을 위한 코드입니다.<br/>
                                아래 인증 코드를 앱에 입력해주세요.
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="padding:20px 0;">
                            <div style="display:inline-block; background:#f0f4ff; border:2px dashed #4a7cff; border-radius:8px; padding:16px 40px;">
                                <span th:text="${code}" style="font-size:32px; font-weight:bold; letter-spacing:8px; color:#4a7cff;">000000</span>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding-top:20px;">
                            <p style="margin:0; font-size:13px; color:#999; line-height:1.5;">
                                • 인증 코드는 10분간 유효합니다.<br/>
                                • 본인이 요청하지 않은 경우 이 메일을 무시해주세요.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
