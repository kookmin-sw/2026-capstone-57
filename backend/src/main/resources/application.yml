spring:
  application:
    name: ilgi-yebo

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_DATABASE:ilgiyebo}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: true
    validate-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080

logging:
  level:
    com.ilgiyebo: DEBUG
    org.hibernate.SQL: DEBUG

auth:
  jwt:
    secret: ${JWT_SECRET:ilgiyebo-default-secret-key-must-be-at-least-32-bytes-long}
    access-token-validity-ms: ${JWT_ACCESS_TOKEN_VALIDITY:3600000}
    refresh-token-validity-ms: ${JWT_REFRESH_TOKEN_VALIDITY:604800000}
  allowed-domains:
    - ac.kr
    - edu
    - university.ac.kr
  verification-expiry-minutes: 10
  university-domain-map:
    kookmin.ac.kr: 국민대학교
    snu.ac.kr: 서울대학교
    korea.ac.kr: 고려대학교
    yonsei.ac.kr: 연세대학교
    kaist.ac.kr: KAIST
    postech.ac.kr: 포항공과대학교
    skku.edu: 성균관대학교
    hanyang.ac.kr: 한양대학교
    sogang.ac.kr: 서강대학교
    cau.ac.kr: 중앙대학교

aws:
  region: ${AWS_REGION:ap-northeast-2}
  bedrock:
    model-id: ${BEDROCK_MODEL_ID:anthropic.claude-3-sonnet-20240229-v1:0}
    timeout-seconds: 30
    max-tokens: 4096