spring:
  application:
    name: ilgi-yebo

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_DATABASE:ilgiyebo}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080

logging:
  level:
    com.ilgiyebo: DEBUG
    org.hibernate.SQL: DEBUG

auth:
  jwt:
    secret: ${JWT_SECRET:ilgiyebo-default-secret-key-must-be-at-least-32-bytes-long}
    access-token-validity-ms: ${JWT_ACCESS_TOKEN_VALIDITY:3600000}
    refresh-token-validity-ms: ${JWT_REFRESH_TOKEN_VALIDITY:604800000}
  allowed-domains:
    - ac.kr
    - edu
    - university.ac.kr
  verification-expiry-minutes: 10
  university-domain-map:
    kookmin.ac.kr: 국민대학교
    snu.ac.kr: 서울대학교
    korea.ac.kr: 고려대학교
    yonsei.ac.kr: 연세대학교
    kaist.ac.kr: KAIST
    postech.ac.kr: 포항공과대학교
    skku.edu: 성균관대학교
    hanyang.ac.kr: 한양대학교
    sogang.ac.kr: 서강대학교
    cau.ac.kr: 중앙대학교

aws:
  region: ${AWS_REGION:ap-northeast-2}
  bedrock:
    model-id: ${BEDROCK_MODEL_ID:anthropic.claude-3-sonnet-20240229-v1:0}
    timeout-seconds: 30
    max-tokens: 4096
  sqs:
    quiz-request-queue: ${SQS_QUIZ_REQUEST_QUEUE:quiz-generation-requests}
    quiz-response-queue: ${SQS_QUIZ_RESPONSE_QUEUE:quiz-generation-responses}
    max-concurrent-messages: 5

quiz:
  generation:
    question-count: 5
    prompt-template: |
      당신은 대학생 친구(이성-동성친구 모두) 매칭 서비스의 퀴즈 생성 AI입니다.
      상대방의 프로필 정보를 기반으로 재미있고 자연스러운 퀴즈 문항을 생성해주세요.
      
      상대방 프로필:
      - 이름: {{name}}
      - 닉네임: {{nickname}}
      - 대학교: {{university}}
      - 전공: {{major}}
      - 취미: {{hobbies}}
      - 관심사: {{interests}}
      - 성격 유형: {{personalityType}}
      
      다음 조건을 만족하는 퀴즈 {{questionCount}}개를 JSON 형식으로 생성해주세요:
      1. 각 문제는 상대방에 대해 알아가는 데 도움이 되는 내용이어야 합니다
      2. 각 문제는 4개의 선택지를 가져야 합니다
      3. 정답은 상대방의 프로필 정보를 기반으로 해야 합니다
      4. 오답은 그럴듯하지만 명확히 구분 가능해야 합니다
      5. 각 문제에 정답의 근거를 설명하는 explanation을 포함해주세요
      
      응답 형식 (JSON만 반환):
      {
        "questions": [
          {
            "questionText": "문제 텍스트",
            "choices": ["선택지1", "선택지2", "선택지3", "선택지4"],
            "correctIndex": 0,
            "explanation": "정답 근거 설명"
          }
        ]
      }
