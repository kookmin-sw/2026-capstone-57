spring:
  application:
    name: ilgi-yebo
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_DATABASE:ilgiyebo}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false
    defer-datasource-initialization: true

  flyway:
    enabled: false

  sql:
    init:
      mode: always

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080

logging:
  level:
    com.ilgiyebo: DEBUG
    org.hibernate.SQL: DEBUG

auth:
  jwt:
    secret: ${JWT_SECRET}
    access-token-validity-ms: ${JWT_ACCESS_TOKEN_VALIDITY}
    refresh-token-validity-ms: ${JWT_REFRESH_TOKEN_VALIDITY}
  allowed-domains:
    - kookmin.ac.kr
  verification-expiry-minutes: 10
  university-domain-map:
    kookmin.ac.kr: 국민대학교

chat:
  session:
    token-limit: ${CHAT_TOKEN_LIMIT:150}
  websocket:
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:*}

ai:
  server:
    base-url: ${AI_SERVER_BASE_URL}
    timeout-ms: ${AI_SERVER_TIMEOUT_MS:10000}
    generate-timeout-ms: ${AI_SERVER_GENERATE_TIMEOUT_MS:60000}
    max-retries: ${AI_SERVER_MAX_RETRIES:3}

cloud:
  aws:
    region:
      static: ${AWS_REGION:us-east-1}
    sqs:
      max-concurrent-messages: 5
      quiz-request-queue: ${SQS_QUIZ_REQUEST_QUEUE}
      quiz-response-queue: ${SQS_QUIZ_RESPONSE_QUEUE}
      mission-request-queue: ${SQS_MISSION_REQUEST_QUEUE}
      mission-response-queue: ${SQS_MISSION_RESPONSE_QUEUE}
    bedrock:
      model-id: ${BEDROCK_MODEL_ID}
