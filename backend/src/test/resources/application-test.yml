spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MYSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672

auth:
  jwt:
    secret: test-secret-key-must-be-at-least-32-bytes-long-for-hmac
    access-token-validity-ms: 3600000
    refresh-token-validity-ms: 604800000
  allowed-domains:
    - ac.kr
    - edu
  verification-expiry-minutes: 10
  university-domain-map:
    kookmin.ac.kr: 국민대학교
    korea.ac.kr: 고려대학교
    snu.ac.kr: 서울대학교
